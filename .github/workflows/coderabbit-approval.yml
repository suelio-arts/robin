name: CodeRabbit Approval

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # Read CodeRabbit's review state for this pull request.
  pull-requests: read

concurrency:
  group: coderabbit-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require current-head CodeRabbit approval
        shell: bash
        run: |
          set -euo pipefail

          github_api() {
            local response
            for attempt in 1 2 3; do
              if response="$(gh api "$@")"; then
                printf '%s' "$response"
                return 0
              fi
              (( attempt == 3 )) || sleep "$attempt"
            done
            return 1
          }

          for attempt in {1..240}; do
            if ! reviews="$(github_api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews")"; then
              echo "Could not read pull-request reviews after 3 attempts" >&2
              exit 1
            fi
            if jq -e --arg head "$HEAD_SHA" '
              reduce (.[][] | select(.user.login == "coderabbitai[bot]" and .commit_id == $head)) as $review
                (false;
                  if $review.state == "APPROVED" then true
                  elif $review.state == "CHANGES_REQUESTED" or $review.state == "DISMISSED" then false
                  else . end)
            ' <<<"$reviews" >/dev/null; then
              if ! current_head="$(github_api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"; then
                echo "Could not recheck the pull-request head after 3 attempts" >&2
                exit 1
              fi
              if [[ "$current_head" != "$HEAD_SHA" ]]; then
                echo "Pull-request head changed from $HEAD_SHA to $current_head" >&2
                exit 1
              fi
              echo "CodeRabbit approved $HEAD_SHA"
              exit 0
            fi
            (( attempt == 240 )) || sleep 15
          done
          echo "CodeRabbit did not approve current head $HEAD_SHA" >&2
          jq -r --arg head "$HEAD_SHA" '
            .[][] | select(.user.login == "coderabbitai[bot]" and .commit_id == $head)
            | "state=\(.state) submitted_at=\(.submitted_at)"
          ' <<<"$reviews" >&2
          exit 1
