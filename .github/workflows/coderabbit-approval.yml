name: CodeRabbit Approval

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coderabbit-approval-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require current-head CodeRabbit approval
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          for _ in {1..60}; do
            reviews="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews")"
            if jq -e --arg head "$head_sha" '
              any(.[][]; .user.login == "coderabbitai[bot]"
                and .commit_id == $head
                and .state == "APPROVED")
            ' <<<"$reviews" >/dev/null; then
              echo "CodeRabbit approved $head_sha"
              exit 0
            fi
            sleep 15
          done
          echo "CodeRabbit did not approve current head $head_sha" >&2
          jq -r --arg head "$head_sha" '
            .[][] | select(.user.login == "coderabbitai[bot]" and .commit_id == $head)
            | "state=\(.state) submitted_at=\(.submitted_at)"
          ' <<<"$reviews" >&2
          exit 1
