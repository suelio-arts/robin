name: "Robin"
description: "Free AI code reviews for every PR. BYOK, works with OpenRouter free tier. Auto-reviews on open, /robin or /review on demand. No quotas."
author: "antongulin"
branding:
  icon: "feather"
  color: "green"

inputs:
  github-token:
    description: "GitHub token for posting PR review comments"
    required: true
    default: "${{ github.token }}"
  pr-number:
    description: "Exact pull request number for a workflow_dispatch review. Ignored for pull_request and issue_comment events."
    required: false
    default: ""
  expected-head-sha:
    description: "Optional full PR head SHA. Robin fails before posting anything if the PR has advanced."
    required: false
    default: ""
  llm-api-key:
    description: "API key for your LLM endpoint. Use \"ollama\" for self-hosted Ollama."
    required: false
    default: "ollama"
  llm-base-url:
    description: "OpenAI-compatible base URL, or rolly-agent on a trusted self-hosted Rolly runner."
    required: true
  model:
    description: "Provider model name, or a Luna profile such as luna-5-6-high-subscription with rolly-agent."
    required: true
  reasoning-effort:
    description: "Optional reasoning effort for compatible models: low, medium, or high."
    required: false
    default: ""
  fail-on-high:
    description: "If true, the action will fail when high severity issues are found."
    required: false
    default: "false"
  request-changes:
    description: "Whether Robin acts as a gatekeeper. true posts REQUEST_CHANGES for high findings and APPROVE otherwise; false always posts COMMENT. Leave empty to use the repo config, which defaults to true."
    required: false
    default: ""
  max-diff-size:
    description: "Maximum diff size in characters to send to the model. Large diffs are truncated."
    required: false
    default: "50000"
  max-output-tokens:
    description: "Optional maximum tokens for the LLM response. Leave empty to use the provider/model default."
    required: false
    default: ""
  llm-timeout-ms:
    description: "Timeout in milliseconds for LLM requests. Default is 10 minutes (600000 ms). Increase if you frequently see 'Request timed out' with large diffs."
    required: false
    default: "600000"
  max-comments:
    description: "Maximum number of inline review comments to post. Extra findings stay in the review body."
    required: false
    default: "15"
  review-on-synchronize:
    description: "Run automatic reviews for pull_request synchronize events, which happen after each new commit pushed to a PR. Set to true only if you want review on every push."
    required: false
    default: "false"
  min-command-permission:
    description: "Minimum repository permission required to run slash commands: read, triage, write, maintain, or admin."
    required: false
    default: "write"
  review-instructions:
    description: "Additional reviewer instructions appended to the built-in review prompt."
    required: false
    default: ""
  review-instructions-file:
    description: "Repository file containing additional reviewer instructions. Read from the PR base branch for safety."
    required: false
    default: ".github/code-reviewer.md"
  config-file:
    description: "Optional repository config file on the PR base branch (.github/robin.yml)."
    required: false
    default: ".github/robin.yml"
  use-json-response-mode:
    description: "Request JSON object responses when the provider supports response_format. Leave empty to use repo config or default true."
    required: false
    default: ""

outputs:
  outcome:
    description: "Coverage of the reviewed head: reviewed, reused, skipped, incomplete, or stale-head (nothing posted)."
  head:
    description: "Full head SHA this run covered. For stale-head it is the current head Robin found instead."
  review-id:
    description: "Numeric id of the review Robin posted, or empty when nothing was posted."
  review-url:
    description: "HTML URL of the review Robin posted, or empty when nothing was posted."
  verdict:
    description: "APPROVED, CHANGES_REQUESTED, or COMMENTED. Empty when nothing was posted."
  high:
    description: "High severity findings. Empty when unknown; 0 for skipped and incomplete."
  medium:
    description: "Medium severity findings. Empty when unknown; 0 for skipped and incomplete."
  low:
    description: "Low severity findings. Empty when unknown; 0 for skipped and incomplete."
  suggestions:
    description: "Suggestions. Empty when unknown; 0 for skipped and incomplete."

runs:
  using: "node24"
  main: "dist/index.js"
